name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    outputs:
      backend_changed:  ${{ steps.changed.outputs.backend }}
      frontend_changed: ${{ steps.changed.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend-app/**'
              - '.github/workflows/**'

  backend-ci:
    name: Backend CI
    needs: detect
    if: needs.detect.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
      POETRY_VIRTUALENVS_IN_PROJECT: true
      POETRY_NO_INTERACTION: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip pipx
          pipx install poetry

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py312-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format check (ruff)
        run: poetry run ruff format --check .
